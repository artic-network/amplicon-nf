[[fields]]
name = "geoLocAdmin1"
display_name = "Admin level 1"
tier = "desired"
definition = "A local administrative region from which the sample was collected (ex: Province, State, Canton)."
example = "Ontario"

[[fields]]
name = "geoLocAdmin2"
display_name = "Admin level 2"
tier = "desired"
definition = "A local administrative region from which the sample was collected (ex: county or municipality)."
example = "City of Toronto"

[[fields]]
name = "host"
display_name = "Host"
tier = "desired"
definition = "NCBI taxon ID or scientific name that uniquely identifies the host from which the sample was collected."
guidance = "You can provide either the scientific name of the organism (e.g., `Aedes aegypti`) or its NCBI taxon ID (e.g., `7159`) in this field. We will validate your input and use it to populate the `hostNameCommon` and `hostNameScientific` fields. If the host is not known, please enter `unidentified`. When uploading data from a pooled sample, we recommend using a higher-level taxon that includes all host organisms in the sample pool. For example, you can use `Culicidae` when uploading data for a pooled mosquito sample (in addition to setting the `specimenProcessing` field to `pooling specimens`, see [OBI:0600016]). (amplicon-nf note: host is REQUIRED by Pathoplexus for dengue, yellow fever, zika and chikungunya submissions; leaving it empty causes a processing error for those organisms.)"
example = "Aedes aegypti"

[[fields]]
name = "authors"
display_name = "Authors"
tier = "required"
definition = "List of authors who should be listed on the sample."
guidance = "Authors should be separated by semi-colons. Each author's name should be in the format `last name, first name;`. Last name(s) is mandatory, only ASCII alphabetical characters A-Z are allowed."
example = "Smith, Anna; Perez, Tom J.; Xu,;"

