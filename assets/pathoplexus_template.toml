# amplicon-nf Pathoplexus metadata template definition
#
# Hand-maintained local copy of the Pathoplexus submission spec, used by the
# PATHOPLEXUS_TEMPLATE module (on unless --skip_pathoplexus_template). Nothing is fetched at runtime.
# Copied from pathoplexus loculus_values/values.yaml at the commit in [provenance].
#
# Contents: only the fields amplicon-nf can fill from run information, plus a small set of
# high-impact fields users are asked to fill in themselves. Users can add any other
# Pathoplexus field as an extra column (exact machine name) before uploading.
#
# File order = column order. `fastaIds` and `files.rawReads` are only written when needed
# (multi-record samples / dehosted reads available). Whether a field is auto-filled is decided
# by the AUTO table in modules/local/pathoplexus/sample/templates/pathoplexus_sample.py, not by
# this file: every field listed here that is not in AUTO is highlighted for the user to fill in.
#
# Keys per field:
#   name          exact Pathoplexus machine name (column header)
#   display_name  Pathoplexus display name
#   tier          "required" | "desired" | "optional" (Pathoplexus base requirement level)
#   definition, guidance, example   copied verbatim from Pathoplexus values.yaml (optional)
#   options       controlled vocabulary, copied verbatim (optional; becomes an XLSX dropdown)
#
# Updating when Pathoplexus changes its spec:
#   1. Find the production pathoplexus commit: deploy/production/config.json (head_sha) in
#      https://github.com/pathoplexus/loculus_deployments
#   2. In loculus_values/values.yaml at that commit, re-copy display name, definition, guidance,
#      example, options and required/desired flags for each field below from
#      defaultOrganismConfig.schema.metadata / extraInputFields.
#   3. Re-check organism-specific overrides (organisms.*.schema.extraInputFields / metadataAdd),
#      e.g. `host` is required for dengue, yellow fever, zika and chikungunya.
#   4. Spot-check against https://pathoplexus.org/<organism>/submission/template?fileType=xlsx
#   5. Update [provenance].

[provenance]
pathoplexus_sha = "71791ce4bf329364ec70362aa1a502cf171030c9"
loculus_version = "e39435956308cea69ca6f11b67352e1ae2f78d07"
checked_on = "2026-11-18"

# ---- linking ----
[[fields]]
name = "id"
display_name = "Sample ID"
tier = "required"
definition = "Your sequence identifier; should match the sequence's id in the FASTA file - this is used to link the metadata to the FASTA sequence. Depending on its format, this ID may be parsed and incorporated in the display name of this sequence on the website if `specimenCollectorSampleId` is not set."
example = "SAMPLE-001"

[[fields]]
name = "fastaIds"
display_name = "FASTA IDs"
tier = "desired"
definition = "Space-separated list of the FASTA IDs of every sequence (e.g. genome segment) that belongs to this metadata entry. Only written by amplicon-nf when at least one sample has more than one consensus sequence."

# ---- user-fill: highlighted in the XLSX ----
[[fields]]
name = "sampleCollectionDate"
display_name = "Collection date"
tier = "required"
definition = "The date (or date range) on which the sample was collected."
guidance = "Please format the date as `YYYY-MM-DD`. If day is unknown, use `YYYY-MM` (e.g., `2020-03`). If both day and month are unknown, use `YYYY` (e.g., `2020`). If only a range is known please supply the range in ISO format `date_lower/date_upper` where `date_lower` and `date_upper` are in the format `YYYY-MM-DD`, `YYYY-MM` or `YYYY`. Please provide at least a year."
example = "2020-03-15"

